plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader("UTF-8") { reader ->
        keyProperties.load(reader)
    }
}

android {
    namespace "com.locatemeup.locatemeup"
    compileSdk 36
    ndkVersion "28.2.13676358"

    // Resolve NDK path: ndk.dir > sdk.dir/ndk/<version> (local.properties)
    def _ndkDir = localProperties.getProperty("ndk.dir")
    def _sdkDir = localProperties.getProperty("sdk.dir")
    if (_ndkDir) {
        ndkPath _ndkDir
    } else if (_sdkDir) {
        ndkPath "${_sdkDir}/ndk/28.2.13676358"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs = freeCompilerArgs + ["-Xskip-metadata-version-check"]
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    signingConfigs {
        release {
            keyAlias keyProperties["keyAlias"]
            keyPassword keyProperties["keyPassword"]
            storeFile keyProperties["storeFile"] ? file(keyProperties["storeFile"]) : null
            storePassword keyProperties["storePassword"]
        }
    }

    defaultConfig {
        applicationId "com.locatemeup.locatemeup"
        minSdkVersion 21
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            ndk {
                debugSymbolLevel "NONE"
            }
        }
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/*.so"]
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7"
    implementation "androidx.multidex:multidex:2.0.1"
}

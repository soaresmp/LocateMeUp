name: locatemeup
description: Location-based alarm app that notifies you when you arrive at a destination.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^12.0.0
  google_maps_flutter: ^2.6.1
  flutter_local_notifications: ^17.2.1

  shared_preferences: ^2.3.2
  google_mobile_ads: ^5.1.0
  in_app_review: ^2.0.9
  permission_handler: ^11.3.1
  geocoding: ^3.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tones/beep.wav
    - assets/tones/pulse.wav
    - assets/tones/alert.wav

